<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Guru - 龚凤乾教授优化版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 龚教授专属精美UI样式 */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .container { width: 100%; max-width: 950px; height: 90vh; background: white; border-radius: 24px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15); overflow: hidden; display: flex; flex-direction: column; }
        
        /* 顶部导语区 */
        .header { background: linear-gradient(90deg, #4b6cb7 0%, #182848 100%); color: white; padding: 25px 30px; text-align: center; flex-shrink: 0; }
        .header h1 { font-size: 2rem; margin-bottom: 8px; letter-spacing: 1px; }
        .header p { font-size: 1rem; opacity: 0.9; font-weight: 300; }

        /* 聊天区域 */
        .chat-container { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 25px; scroll-behavior: smooth; background: #fafafa; }
        .message { display: flex; max-width: 88%; animation: fadeIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; }
        .user-message { align-self: flex-end; flex-direction: row-reverse; }
        .message-content { padding: 16px 22px; border-radius: 20px; line-height: 1.7; font-size: 1.05rem; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
        .user-message .message-content { background: linear-gradient(135deg, #4b6cb7, #182848); color: white; border-bottom-right-radius: 4px; }
        .ai-message .message-content { background: white; color: #2c3e50; border-bottom-left-radius: 4px; border: 1px solid #edf2f7; }
        
        /* 图标样式 */
        .message-icon { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin: 0 12px; font-size: 1.3rem; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .user-message .message-icon { background: #8E54E9; color: white; }
        .ai-message .message-icon { background: #FF5E62; color: white; }

        /* 跳动气泡动画 */
        .typing-bubble { display: flex; align-items: center; gap: 5px; padding: 15px 22px; background: white; border-radius: 20px; border: 1px solid #edf2f7; width: fit-content; }
        .dot { width: 9px; height: 9px; background: #4b6cb7; border-radius: 50%; animation: dotBounce 1.4s infinite ease-in-out; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotBounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
        }

        /* 输入控制区 */
        .input-container { padding: 25px 35px; border-top: 1px solid #eee; display: flex; gap: 15px; background: white; align-items: center; }
        #userInput { flex: 1; padding: 15px 25px; border: 2px solid #e2e8f0; border-radius: 30px; outline: none; font-size: 1.1rem; transition: 0.3s; }
        #userInput:focus { border-color: #4b6cb7; box-shadow: 0 0 0 3px rgba(75, 108, 183, 0.1); }
        
        .action-button { width: 55px; height: 55px; border-radius: 50%; border: none; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; transition: 0.3s; font-size: 1.4rem; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #sendBtn { background: #4b6cb7; }
        #sendBtn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(75, 108, 183, 0.3); }
        #voiceBtn { background: #FF5E62; }
        #ttsBtn { background: #36D1DC; }
        
        .status-msg { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 12px 25px; border-radius: 30px; color: white; font-size: 0.95rem; display: none; z-index: 1000; box-shadow: 0 10px 20px rgba(0,0,0,0.15); font-weight: 500; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="status" class="status-msg"></div>

    <div class="container">
        <div class="header">
            <h1>Grammar Guru</h1>
            <p>由龚凤乾教授精心设计的普适优化版</p>
        </div>
        
        <div class="chat-container" id="chatWindow">
            <div class="message ai-message">
                <div class="message-icon"><i class="fas fa-robot"></i></div>
                <div class="message-content">
                    Greetings! I am your AI Grammar Tutor. How can I assist you today?<br>
                    你好！我是您的AI语法导师。今天有什么我可以帮您的吗？
                </div>
            </div>
        </div>
        
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Ask me anything about English grammar..." autocomplete="off">
            <button class="action-button" id="voiceBtn" title="Voice Input"><i class="fas fa-microphone"></i></button>
            <button class="action-button" id="sendBtn" title="Send Message"><i class="fas fa-paper-plane"></i></button>
            <button class="action-button" id="ttsBtn" title="Speak Response"><i class="fas fa-volume-up"></i></button>
        </div>
    </div>

    <script>
        const API_URL = '/api/deepseek-api'; 
        let lastResponse = ""; 

        const chatWindow = document.getElementById('chatWindow');
        const userInput = document.getElementById('userInput');

        // ==================== 极速发送与双语识别逻辑 ====================
        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';

            // 1. 即刻显示跳动气泡
            const loadingBubble = createLoadingBubble();
            chatWindow.appendChild(loadingBubble);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            // 2. 检测语言偏好 (上帝的归上帝)
            const isEnglish = /^[a-zA-Z0-9\s,.'";:?!!]+$/.test(text);
            const systemPrompt = isEnglish 
                ? "You are an expert English Grammar Professor. If the user asks in English, answer in sophisticated and detailed English, catering to high-level learners. Focus on nuanced usage and linguistic accuracy."
                : "你是一位资深的英语教授。如果用户用中文提问，请用中文进行详尽解答，内容需兼顾基础与深度分析。请注意排版清晰。";

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: text }
                        ],
                        temperature: 0.6 // 提高解释的专业性与稳定性
                    })
                });

                const data = await response.json();
                loadingBubble.remove(); 

                if (data.choices && data.choices[0]) {
                    const aiMsg = data.choices[0].message.content;
                    addMessage(aiMsg, 'ai');
                    lastResponse = aiMsg;
                } else { throw new Error(); }
            } catch (err) {
                loadingBubble.remove();
                addMessage("I apologize, but I encountered a connection issue. Please try again. / 抱歉，连接出现问题，请重试。", "ai");
            }
        }

        // 创建跳动的圆点气泡
        function createLoadingBubble() {
            const div = document.createElement('div');
            div.className = "message ai-message";
            div.innerHTML = `
                <div class="message-icon"><i class="fas fa-robot"></i></div>
                <div class="typing-bubble">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            `;
            return div;
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}-message`;
            // 处理换行符，让学术解释更有层次感
            const formattedText = text.replace(/\n/g, '<br>');
            div.innerHTML = `
                <div class="message-icon"><i class="fas fa-${sender==='user'?'user':'robot'}"></i></div>
                <div class="message-content">${formattedText}</div>
            `;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // ==================== TTS 语音：星号过滤 + 读音纠错 ====================
        function handleTTS() {
            if (!lastResponse) return;
            window.speechSynthesis.cancel();

            // 过滤逻辑：1.星号等符号变为空格 2.“重读”变“仲读”(zhòng)
            let cleanText = lastResponse
                .replace(/[*#\-_/\\()[\]{}]/g, ' ') 
                .replace(/重读/g, '仲读'); 

            const utter = new SpeechSynthesisUtterance(cleanText);
            // 自动判断中英文发音引擎
            utter.lang = /[\u4e00-\u9fa5]/.test(cleanText) ? 'zh-CN' : 'en-US';
            utter.rate = 0.92;
            window.speechSynthesis.speak(utter);
            showStatus("Speaking... / 正在朗读...", "#36D1DC");
        }

        // ==================== 语音识别支持 ====================
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            document.getElementById('voiceBtn').onclick = () => {
                recognition.start();
                showStatus("Listening... / 正在听取...", "#FF9966");
            };
            recognition.onresult = (e) => {
                userInput.value = e.results[0][0].transcript;
                handleSend();
            };
        }

        function showStatus(msg, color) {
            const s = document.getElementById('status');
            s.innerText = msg; s.style.backgroundColor = color; s.style.display = 'block';
            setTimeout(() => s.style.display='none', 2500);
        }

        document.getElementById('sendBtn').onclick = handleSend;
        document.getElementById('ttsBtn').onclick = handleTTS;
        userInput.onkeypress = (e) => { if(e.key === 'Enter') handleSend(); };
    </script>
</body>
</html>
