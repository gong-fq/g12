<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Guru - AI英语语法导师</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 保持龚教授设计的精美界面 */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 900px; height: 90vh; background: white; border-radius: 24px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15); overflow: hidden; display: flex; flex-direction: column; }
        .header { background: linear-gradient(90deg, #4b6cb7 0%, #182848 100%); color: white; padding: 24px 30px; text-align: center; flex-shrink: 0; position: relative; }
        .header h1 { font-size: 2rem; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 15px; }
        .chat-container { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 20px; }
        .message { display: flex; max-width: 85%; animation: fadeIn 0.4s ease-out; }
        .user-message { align-self: flex-end; flex-direction: row-reverse; }
        .message-content { padding: 15px 20px; border-radius: 20px; line-height: 1.6; font-size: 1.05rem; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .user-message .message-content { background: #4b6cb7; color: white; border-bottom-right-radius: 2px; }
        .ai-message .message-content { background: #f0f4f9; color: #333; border-bottom-left-radius: 2px; border: 1px solid #e1e8f0; }
        .message-icon { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin: 0 12px; font-size: 1.2rem; }
        .user-message .message-icon { background: #8E54E9; color: white; }
        .ai-message .message-icon { background: #FF5E62; color: white; }
        .input-container { padding: 20px 30px; border-top: 1px solid #eee; display: flex; gap: 10px; background: white; }
        #userInput { flex: 1; padding: 15px 25px; border: 2px solid #e1e8f0; border-radius: 30px; outline: none; font-size: 1rem; }
        .action-button { width: 50px; height: 50px; border-radius: 50%; border: none; cursor: pointer; color: white; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        #sendBtn { background: #4b6cb7; }
        #voiceBtn { background: #FF5E62; }
        #ttsBtn { background: #36D1DC; }
        .typing { display: none; padding: 10px 20px; background: #f0f4f9; border-radius: 20px; width: fit-content; margin-bottom: 10px; font-size: 0.9rem; color: #666; }
        .status-msg { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; color: white; display: none; z-index: 9999; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="status" class="status-msg"></div>

    <div class="container">
        <div class="header">
            <h1><i class="fas fa-graduation-cap"></i> Grammar Guru</h1>
            <p>由龚凤乾教授设计 - Netlify 部署修复版</p>
        </div>
        
        <div class="chat-container" id="chatWindow">
            <div class="message ai-message">
                <div class="message-icon"><i class="fas fa-robot"></i></div>
                <div class="message-content">你好！我是您的英语语法导师。请点击麦克风说话或在下方输入问题。</div>
            </div>
            <div id="typing" class="typing">AI 正在思考...</div>
        </div>
        
        <div class="input-container">
            <input type="text" id="userInput" placeholder="请输入语法问题..." autocomplete="off">
            <button class="action-button" id="voiceBtn" title="语音输入"><i class="fas fa-microphone"></i></button>
            <button class="action-button" id="sendBtn" title="发送提问"><i class="fas fa-paper-plane"></i></button>
            <button class="action-button" id="ttsBtn" title="朗读最后回答"><i class="fas fa-volume-up"></i></button>
        </div>
    </div>

    <script>
        // 协调点：路径必须匹配 netlify.toml 中的转发规则和文件名
        const API_URL = '/api/deepseek-api'; 
        let lastResponse = ""; // 记录最后一条AI回复用于朗读

        const chatWindow = document.getElementById('chatWindow');
        const userInput = document.getElementById('userInput');
        const typingIndicator = document.getElementById('typing');

        // ==================== 发送提问 ====================
        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';
            typingIndicator.style.display = 'block';
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                // 向 Netlify Functions 发送请求
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [{ role: "user", content: text }]
                    })
                });

                const data = await response.json();
                typingIndicator.style.display = 'none';

                if (data.choices && data.choices[0]) {
                    const aiMsg = data.choices[0].message.content;
                    addMessage(aiMsg, 'ai');
                    lastResponse = aiMsg; // 存入朗读缓存
                } else {
                    throw new Error("API 响应错误");
                }
            } catch (err) {
                typingIndicator.style.display = 'none';
                showStatus("服务器繁忙：请确保已在 Netlify 后台设置 API Key", "#FF5E62");
                console.error(err);
            }
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}-message`;
            div.innerHTML = `
                <div class="message-icon"><i class="fas fa-${sender==='user'?'user':'robot'}"></i></div>
                <div class="message-content">${text.replace(/\n/g, '<br>')}</div>
            `;
            chatWindow.insertBefore(div, typingIndicator);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // ==================== 朗读逻辑：纠正“重读”+过滤符号 ====================
        function handleTTS() {
            if (!lastResponse) {
                showStatus("请先提问再使用朗读功能", "#FFD43B");
                return;
            }
            window.speechSynthesis.cancel(); // 停止当前正在读的内容

            // 1. 物理移除所有非字母数字的特殊符号（如 * # - /）
            let cleanText = lastResponse.replace(/[*#\-_/\\()[\]{}]/g, ' '); 
            
            // 2. 修正多音字读音：将“重读”替换为“仲读”强制发四声 (zhòng)
            cleanText = cleanText.replace(/重读/g, '仲读'); 

            const utter = new SpeechSynthesisUtterance(cleanText);
            utter.lang = /[\u4e00-\u9fa5]/.test(cleanText) ? 'zh-CN' : 'en-US';
            utter.rate = 0.9; // 语速稍慢
            
            window.speechSynthesis.speak(utter);
            showStatus("正在为您朗读...", "#36D1DC");
        }

        // ==================== 语音输入功能 ====================
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            document.getElementById('voiceBtn').onclick = () => {
                recognition.start();
                showStatus("正在听取，请开始说话...", "#FF9966");
            };
            recognition.onresult = (e) => {
                userInput.value = e.results[0][0].transcript;
                handleSend(); // 识别后自动发送
            };
        } else {
            document.getElementById('voiceBtn').onclick = () => showStatus("您的浏览器不支持语音录入", "#FF5E62");
        }

        function showStatus(msg, color) {
            const s = document.getElementById('status');
            s.innerText = msg; s.style.backgroundColor = color; s.style.display = 'block';
            setTimeout(() => s.style.display='none', 3000);
        }

        // ==================== 事件绑定 ====================
        document.getElementById('sendBtn').onclick = handleSend;
        document.getElementById('ttsBtn').onclick = handleTTS;
        userInput.onkeypress = (e) => { if(e.key === 'Enter') handleSend(); };
    </script>
</body>
</html>
