<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Guru - 龚凤乾教授学术增强版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 界面美化与动画逻辑 */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 1000px; height: 92vh; background: white; border-radius: 24px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15); overflow: hidden; display: flex; flex-direction: column; }
        
        /* 导语区 */
        .header { background: linear-gradient(90deg, #2c3e50 0%, #000000 100%); color: white; padding: 20px 30px; text-align: center; flex-shrink: 0; }
        .header h1 { font-size: 1.8rem; margin-bottom: 5px; letter-spacing: 1px; }
        .header p { font-size: 0.95rem; opacity: 0.8; font-style: italic; }

        /* 聊天区 */
        .chat-container { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 25px; background: #fdfdfd; }
        .message { display: flex; max-width: 90%; animation: fadeIn 0.4s ease-out; }
        .user-message { align-self: flex-end; flex-direction: row-reverse; }
        .message-content { padding: 18px 25px; border-radius: 20px; line-height: 1.8; font-size: 1.1rem; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .user-message .message-content { background: #34495e; color: white; border-bottom-right-radius: 4px; }
        .ai-message .message-content { background: white; color: #2c3e50; border: 1px solid #eee; border-bottom-left-radius: 4px; }
        
        .message-icon { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin: 0 15px; font-size: 1.3rem; }
        .user-message .message-icon { background: #5d6d7e; color: white; }
        .ai-message .message-icon { background: #e74c3c; color: white; }

        /* 跳动圆点动画 */
        .typing-bubble { display: flex; align-items: center; gap: 6px; padding: 15px 25px; background: #f8f9fa; border-radius: 20px; width: fit-content; }
        .dot { width: 10px; height: 10px; background: #34495e; border-radius: 50%; animation: dotBounce 1.4s infinite ease-in-out; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotBounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-12px); } }

        /* 输入区 */
        .input-container { padding: 25px; border-top: 1px solid #eee; display: flex; gap: 15px; background: white; }
        #userInput { flex: 1; padding: 15px 25px; border: 2px solid #ddd; border-radius: 35px; outline: none; font-size: 1.1rem; transition: 0.3s; }
        #userInput:focus { border-color: #2c3e50; }
        .action-button { width: 55px; height: 55px; border-radius: 50%; border: none; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; transition: 0.3s; }
        #sendBtn { background: #2c3e50; }
        #voiceBtn { background: #e74c3c; }
        #ttsBtn { background: #1abc9c; }
        
        .status-msg { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 10px 25px; border-radius: 30px; color: white; font-size: 0.9rem; display: none; z-index: 1000; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="status" class="status-msg"></div>
    <div class="container">
        <div class="header">
            <h1>Grammar Guru</h1>
            <p>由龚凤乾教授精心设计的普适优化版</p>
        </div>
        <div class="chat-container" id="chatWindow">
            <div class="message ai-message">
                <div class="message-icon"><i class="fas fa-university"></i></div>
                <div class="message-content">
                    Ready for academic discourse. / 准备好为您进行学术解答。
                </div>
            </div>
        </div>
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Ask your grammar question here..." autocomplete="off">
            <button class="action-button" id="voiceBtn"><i class="fas fa-microphone"></i></button>
            <button class="action-button" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            <button class="action-button" id="ttsBtn"><i class="fas fa-volume-up"></i></button>
        </div>
    </div>

    <script>
        const API_URL = '/api/deepseek-api'; 
        let lastResponse = ""; 

        async function handleSend() {
            const text = document.getElementById('userInput').value.trim();
            if (!text) return;

            addMessage(text, 'user');
            document.getElementById('userInput').value = '';

            const loadingBubble = createLoadingBubble();
            document.getElementById('chatWindow').appendChild(loadingBubble);
            document.getElementById('chatWindow').scrollTop = document.getElementById('chatWindow').scrollHeight;

            // 语种检测逻辑 (Caesar's to Caesar)
            const isEnglish = /^[a-zA-Z0-9\s,.'";:?!!()]+$/.test(text);
            const systemPrompt = isEnglish 
                ? "You are a distinguished Professor of Linguistics. Provide exhaustive, academic, and detailed explanations. Do not summarize briefly; instead, provide nuance, pragmatic differences, and multiple illustrative examples. Respond EXCLUSIVELY in English."
                : "你是一位博学严谨的英语教授。请提供深度、详尽且具有学术厚度的解答。不要只给出一两句小结，要深入分析语用差异，并提供丰富的对比示例。必须全程使用中文回复。";

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: text }
                        ],
                        max_tokens: 2500, // 大幅提升输出上限
                        temperature: 0.6
                    })
                });

                const data = await response.json();
                loadingBubble.remove(); 

                if (data.choices && data.choices[0]) {
                    const aiMsg = data.choices[0].message.content;
                    addMessage(aiMsg, 'ai');
                    lastResponse = aiMsg;
                }
            } catch (err) {
                loadingBubble.remove();
                showStatus("Error connecting to server.", "#e74c3c");
            }
        }

        function createLoadingBubble() {
            const div = document.createElement('div');
            div.className = "message ai-message";
            div.innerHTML = `<div class="message-icon"><i class="fas fa-university"></i></div>
                             <div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
            return div;
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}-message`;
            div.innerHTML = `<div class="message-icon"><i class="fas fa-${sender==='user'?'user-graduate':'university'}"></i></div>
                             <div class="message-content">${text.replace(/\n/g, '<br>')}</div>`;
            document.getElementById('chatWindow').appendChild(div);
            document.getElementById('chatWindow').scrollTop = document.getElementById('chatWindow').scrollHeight;
        }

        function handleTTS() {
            if (!lastResponse) return;
            window.speechSynthesis.cancel();
            let cleanText = lastResponse.replace(/[*#\-_/\\()[\]{}]/g, ' ').replace(/重读/g, '仲读'); 
            const utter = new SpeechSynthesisUtterance(cleanText);
            utter.lang = /[\u4e00-\u9fa5]/.test(cleanText) ? 'zh-CN' : 'en-US';
            window.speechSynthesis.speak(utter);
        }

        function showStatus(msg, color) {
            const s = document.getElementById('status');
            s.innerText = msg; s.style.backgroundColor = color; s.style.display = 'block';
            setTimeout(() => s.style.display='none', 2500);
        }

        document.getElementById('sendBtn').onclick = handleSend;
        document.getElementById('ttsBtn').onclick = handleTTS;
        document.getElementById('userInput').onkeypress = (e) => { if(e.key === 'Enter') handleSend(); };
    </script>
</body>
</html>
