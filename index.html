<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Guru - 龚凤乾教授普适优化版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 1000px; height: 92vh; background: white; border-radius: 24px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2); overflow: hidden; display: flex; flex-direction: column; }
        .header { background: linear-gradient(90deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 25px; text-align: center; flex-shrink: 0; }
        .header h1 { font-size: 2rem; margin-bottom: 5px; }
        .header p { font-size: 1.1rem; opacity: 0.9; }

        .chat-container { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 25px; background: #fdfdfd; }
        .message { display: flex; max-width: 90%; animation: fadeIn 0.4s ease; }
        .user-message { align-self: flex-end; flex-direction: row-reverse; }
        .message-content { padding: 18px 25px; border-radius: 20px; line-height: 1.8; font-size: 1.1rem; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .user-message .message-content { background: #2a5298; color: white; border-bottom-right-radius: 4px; }
        .ai-message .message-content { background: white; color: #1a1a1a; border: 1px solid #eef2f7; border-bottom-left-radius: 4px; }
        
        .message-icon { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin: 0 15px; }
        .user-message .message-icon { background: #5d6d7e; color: white; }
        .ai-message .message-icon { background: #e74c3c; color: white; }

        /* 跳动气泡动画 */
        .typing-bubble { display: flex; align-items: center; gap: 6px; padding: 15px 25px; background: white; border-radius: 20px; border: 1px solid #eee; width: fit-content; }
        .dot { width: 10px; height: 10px; background: #2a5298; border-radius: 50%; animation: dotBounce 1.4s infinite ease-in-out; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotBounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-10px); } }

        .input-container { padding: 25px; border-top: 1px solid #eee; display: flex; gap: 15px; }
        #userInput { flex: 1; padding: 15px 25px; border: 2px solid #ddd; border-radius: 35px; outline: none; font-size: 1.1rem; }
        .action-button { width: 55px; height: 55px; border-radius: 50%; border: none; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
        #sendBtn { background: #2a5298; }
        #voiceBtn { background: #e74c3c; }
        #ttsBtn { background: #1abc9c; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Grammar Guru</h1>
            <p>由龚凤乾教授精心设计的普适优化版</p>
        </div>
        <div class="chat-container" id="chatWindow">
            <div class="message ai-message">
                <div class="message-icon"><i class="fas fa-university"></i></div>
                <div class="message-content">学术讨论已就绪。 / Academic discourse ready.</div>
            </div>
        </div>
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Ask your grammar question..." autocomplete="off">
            <button class="action-button" id="voiceBtn"><i class="fas fa-microphone"></i></button>
            <button class="action-button" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            <button class="action-button" id="ttsBtn"><i class="fas fa-volume-up"></i></button>
        </div>
    </div>

    <script>
        const API_URL = '/api/deepseek-api'; 
        let lastResponse = ""; 

        async function handleSend() {
            const text = document.getElementById('userInput').value.trim();
            if (!text) return;

            addMessage(text, 'user');
            document.getElementById('userInput').value = '';

            const loadingBubble = createLoadingBubble();
            document.getElementById('chatWindow').appendChild(loadingBubble);
            document.getElementById('chatWindow').scrollTop = document.getElementById('chatWindow').scrollHeight;

            // 1. 严格语种镜像 (Caesar's to Caesar)
            const isEnglish = /^[a-zA-Z0-9\s,.'";:?!!()（）\-]+$/.test(text);
            
            // 2. 深度提示词：要求详尽、举例、并结尾邀请提问
            const systemPrompt = isEnglish 
                ? "You are a Professor of Linguistics. Answer EXCLUSIVELY in English. Provide exhaustive explanations with multiple examples for higher-level learners. Always end your response by kindly inviting the user to ask more relevant questions."
                : "你是一位博学严谨的英语教授。必须全程使用中文回复。请提供详尽、深度的学术解答并配以丰富的例句。每段回答结束时，请礼貌地邀请用户提出更多相关的语法问题。";

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: text }
                        ]
                    })
                });

                if (!response.ok) throw new Error();

                const data = await response.json();
                loadingBubble.remove(); 

                if (data.choices && data.choices[0]) {
                    const aiMsg = data.choices[0].message.content;
                    addMessage(aiMsg, 'ai');
                    lastResponse = aiMsg;
                }
            } catch (err) {
                loadingBubble.remove();
                addMessage("I apologize, Professor. The response took too long. Please try a more specific question. / 抱歉教授，响应超时，请尝试缩小提问范围。", "ai");
            }
        }

        function createLoadingBubble() {
            const div = document.createElement('div');
            div.className = "message ai-message";
            div.innerHTML = `<div class="message-icon"><i class="fas fa-university"></i></div>
                             <div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
            return div;
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}-message`;
            div.innerHTML = `<div class="message-icon"><i class="fas fa-${sender==='user'?'user-graduate':'university'}"></i></div>
                             <div class="message-content">${text.replace(/\n/g, '<br>')}</div>`;
            document.getElementById('chatWindow').appendChild(div);
            document.getElementById('chatWindow').scrollTop = document.getElementById('chatWindow').scrollHeight;
        }

        function handleTTS() {
            if (!lastResponse) return;
            window.speechSynthesis.cancel();
            // 清理文本：过滤星号并纠正读音
            let cleanText = lastResponse.replace(/[*#\-_/\\()[\]{}]/g, ' ').replace(/重读/g, '仲读'); 
            const utter = new SpeechSynthesisUtterance(cleanText);
            utter.lang = /[\u4e00-\u9fa5]/.test(cleanText) ? 'zh-CN' : 'en-US';
            window.speechSynthesis.speak(utter);
        }

        document.getElementById('sendBtn').onclick = handleSend;
        document.getElementById('ttsBtn').onclick = handleTTS;
        document.getElementById('userInput').onkeypress = (e) => { if(e.key === 'Enter') handleSend(); };
    </script>
</body>
</html>
