<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Guru - 龚凤乾教授学术增强版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 保持您喜爱的精美UI */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background: #f0f2f5; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { width: 95%; max-width: 900px; height: 90vh; background: white; border-radius: 20px; box-shadow: 0 15px 50px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .header { background: #2a5298; color: white; padding: 20px; text-align: center; }
        .chat-container { flex: 1; overflow-y: auto; padding: 25px; background: #fafafa; }
        .message { display: flex; margin-bottom: 20px; animation: slideIn 0.3s ease; }
        .user-message { flex-direction: row-reverse; }
        .message-content { max-width: 80%; padding: 15px 20px; border-radius: 15px; line-height: 1.6; font-size: 1.05rem; position: relative; }
        .ai-message .message-content { background: white; border: 1px solid #eee; color: #333; }
        .user-message .message-content { background: #2a5298; color: white; }
        
        /* 跳动气泡：龚教授喜爱的动感设计 */
        .dot { width: 8px; height: 8px; background: #2a5298; border-radius: 50%; display: inline-block; animation: bounce 1.4s infinite ease-in-out; margin: 0 2px; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        
        .input-area { padding: 20px; border-top: 1px solid #eee; display: flex; gap: 10px; align-items: center; }
        #userInput { flex: 1; padding: 12px 20px; border: 2px solid #eee; border-radius: 25px; outline: none; transition: 0.3s; }
        #userInput:focus { border-color: #2a5298; }
        .btn { width: 45px; height: 45px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: 0.3s; }
        .btn-send { background: #2a5298; color: white; }
        .btn-voice { background: #e74c3c; color: white; }
        .btn-tts { background: #1abc9c; color: white; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Grammar Guru</h2>
            <p style="font-size: 0.9rem; opacity: 0.8;">由龚凤乾教授精心设计的普适优化版</p>
        </div>
        <div class="chat-container" id="chat">
            <div class="message ai-message">
                <div class="message-content">学术讨论已就绪。 / Ready for academic discourse.</div>
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask your question...">
            <button class="btn btn-voice" id="voiceBtn"><i class="fas fa-microphone"></i></button>
            <button class="btn btn-send" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            <button class="btn btn-tts" id="ttsBtn"><i class="fas fa-volume-up"></i></button>
        </div>
    </div>

    <script>
        let lastResponse = "";
        const chat = document.getElementById('chat');
        const input = document.getElementById('userInput');

        async function handleSend() {
            const val = input.value.trim();
            if(!val) return;
            
            appendMsg(val, 'user');
            input.value = '';

            const loading = document.createElement('div');
            loading.className = 'message ai-message';
            loading.innerHTML = `<div class="message-content"><div class="dot"></div><div class="dot"></div><div class="dot"></div><br><small style="color:#999">正在构思深度解析...</small></div>`;
            chat.appendChild(loading);
            chat.scrollTop = chat.scrollHeight;

            // Caesar's to Caesar
            const isEng = /^[a-zA-Z0-9\s,.'";:?!!()]+$/.test(val);
            const prompt = isEng 
                ? "Academic Linguistics Professor. Answer EXCLUSIVELY in English. Provide detailed structural analysis, 3+ practical examples, and formal usage notes. End with: 'Any further details you'd like to explore?'"
                : "资深英语教授。必须用中文详细解答。包含语法定义、核心用法、3个以上典型例句、以及高水平读者的进阶提示。结尾请问：'关于此点，您还有其他想深入探讨的吗？'";

            try {
                const res = await fetch('/api/deepseek-api', {
                    method: 'POST',
                    body: JSON.stringify({ messages: [{role:"system", content:prompt}, {role:"user", content:val}] })
                });

                loading.remove();
                if(!res.ok) throw new Error();

                const data = await res.json();
                const reply = data.choices[0].message.content;
                appendMsg(reply, 'ai');
                lastResponse = reply;
            } catch {
                loading.remove();
                appendMsg("Professor, the analysis is very deep today and timed out. Please try a more specific part of this question. / 抱歉教授，内容解析过深导致连接超时，请尝试缩小提问范围。", 'ai');
            }
        }

        function appendMsg(txt, sender) {
            const m = document.createElement('div');
            m.className = `message ${sender}-message`;
            m.innerHTML = `<div class="message-content">${txt.replace(/\n/g, '<br>')}</div>`;
            chat.appendChild(m);
            chat.scrollTop = chat.scrollHeight;
        }

        document.getElementById('sendBtn').onclick = handleSend;
        input.onkeypress = (e) => { if(e.key === 'Enter') handleSend(); };
        document.getElementById('ttsBtn').onclick = () => {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(lastResponse.replace(/[*#]/g, '').replace(/重读/g, '仲读'));
            u.lang = /[\u4e00-\u9fa5]/.test(lastResponse) ? 'zh-CN' : 'en-US';
            window.speechSynthesis.speak(u);
        };
    </script>
</body>
</html>
