<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Guru - 加速优化版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .container { width: 100%; max-width: 900px; height: 90vh; background: white; border-radius: 24px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15); overflow: hidden; display: flex; flex-direction: column; }
        
        /* 顶部样式 */
        .header { background: linear-gradient(90deg, #4b6cb7 0%, #182848 100%); color: white; padding: 20px 30px; text-align: center; flex-shrink: 0; }
        .header h1 { font-size: 1.8rem; margin-bottom: 5px; }
        .header p { font-size: 0.9rem; opacity: 0.8; }

        /* 聊天区域 */
        .chat-container { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
        .message { display: flex; max-width: 85%; animation: fadeIn 0.3s ease-out; position: relative; }
        .user-message { align-self: flex-end; flex-direction: row-reverse; }
        .message-content { padding: 14px 18px; border-radius: 18px; line-height: 1.6; font-size: 1.05rem; box-shadow: 0 3px 10px rgba(0,0,0,0.05); }
        .user-message .message-content { background: #4b6cb7; color: white; border-bottom-right-radius: 2px; }
        .ai-message .message-content { background: #f0f4f9; color: #333; border-bottom-left-radius: 2px; border: 1px solid #e1e8f0; }
        .message-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin: 0 10px; font-size: 1.1rem; }
        .user-message .message-icon { background: #8E54E9; color: white; }
        .ai-message .message-icon { background: #FF5E62; color: white; }

        /* 三个跳动的小球动画 */
        .typing-bubble { display: flex; align-items: center; gap: 4px; padding: 10px 15px; background: #f0f4f9; border-radius: 15px; width: fit-content; border: 1px solid #e1e8f0; }
        .dot { width: 8px; height: 8px; background: #4b6cb7; border-radius: 50%; animation: dotBounce 1.4s infinite ease-in-out; opacity: 0.6; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotBounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
        }

        /* 输入区域 */
        .input-container { padding: 20px; border-top: 1px solid #eee; display: flex; gap: 10px; background: white; }
        #userInput { flex: 1; padding: 12px 20px; border: 2px solid #e1e8f0; border-radius: 25px; outline: none; font-size: 1rem; transition: border-color 0.3s; }
        #userInput:focus { border-color: #4b6cb7; }
        .action-button { width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; transition: 0.2s; font-size: 1.2rem; }
        #sendBtn { background: #4b6cb7; }
        #sendBtn:hover { transform: scale(1.05); background: #182848; }
        #voiceBtn { background: #FF5E62; }
        #ttsBtn { background: #36D1DC; }
        
        .status-msg { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 20px; color: white; font-size: 0.9rem; display: none; z-index: 100; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="status" class="status-msg"></div>

    <div class="container">
        <div class="header">
            <h1>Grammar Guru</h1>
            <p>由龚教授精心设计的极速优化版</p>
        </div>
        
        <div class="chat-container" id="chatWindow">
            <div class="message ai-message">
                <div class="message-icon"><i class="fas fa-robot"></i></div>
                <div class="message-content">你好！我是您的英语语法导师。今天想聊聊什么语法问题？</div>
            </div>
        </div>
        
        <div class="input-container">
            <input type="text" id="userInput" placeholder="在此输入提问，按回车发送..." autocomplete="off">
            <button class="action-button" id="voiceBtn" title="语音输入"><i class="fas fa-microphone"></i></button>
            <button class="action-button" id="sendBtn" title="发送提won"><i class="fas fa-paper-plane"></i></button>
            <button class="action-button" id="ttsBtn" title="朗读最后回答"><i class="fas fa-volume-up"></i></button>
        </div>
    </div>

    <script>
        const API_URL = '/api/deepseek-api'; 
        let lastResponse = ""; 

        const chatWindow = document.getElementById('chatWindow');
        const userInput = document.getElementById('userInput');

        // ==================== 即刻发送优化 ====================
        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. 即刻渲染用户消息
            addMessage(text, 'user');
            userInput.value = '';

            // 2. 即刻弹出“跳动气泡”占位
            const loadingBubble = createLoadingBubble();
            chatWindow.appendChild(loadingBubble);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                // 3. 后端加速请求
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        // 通过 prompt 引导 AI 简洁回答，从而减少生成耗时
                        messages: [{ role: "user", content: text + " (请精准且简短地回答，不要输出多余的引导词)" }]
                    })
                });

                const data = await response.json();
                loadingBubble.remove(); // 移除跳动圆点

                if (data.choices && data.choices[0]) {
                    const aiMsg = data.choices[0].message.content;
                    addMessage(aiMsg, 'ai');
                    lastResponse = aiMsg;
                } else {
                    throw new Error();
                }
            } catch (err) {
                loadingBubble.remove();
                addMessage("抱歉，我刚刚分神了，请再试一次。", "ai");
                showStatus("网络连接异常", "#FF5E62");
            }
        }

        // 创建跳动的小球气泡
        function createLoadingBubble() {
            const div = document.createElement('div');
            div.className = "message ai-message";
            div.innerHTML = `
                <div class="message-icon"><i class="fas fa-robot"></i></div>
                <div class="typing-bubble">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            `;
            return div;
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}-message`;
            div.innerHTML = `
                <div class="message-icon"><i class="fas fa-${sender==='user'?'user':'robot'}"></i></div>
                <div class="message-content">${text.replace(/\n/g, '<br>')}</div>
            `;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // ==================== 朗读优化：清理星号 + 纠正“重读” ====================
        function handleTTS() {
            if (!lastResponse) return;
            window.speechSynthesis.cancel();

            // 物理过滤：删除星号、井号等符号；纠正多音字
            let cleanText = lastResponse
                .replace(/[*#\-_/\\()[\]{}]/g, ' ') 
                .replace(/重读/g, '仲读'); // 强制读 zhòng

            const utter = new SpeechSynthesisUtterance(cleanText);
            utter.lang = /[\u4e00-\u9fa5]/.test(cleanText) ? 'zh-CN' : 'en-US';
            utter.rate = 0.95;
            window.speechSynthesis.speak(utter);
            showStatus("正在朗读（已自动过滤符号）", "#36D1DC");
        }

        // ==================== 语音识别 ====================
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            document.getElementById('voiceBtn').onclick = () => {
                recognition.start();
                showStatus("正在听取您的声音...", "#FF9966");
            };
            recognition.onresult = (e) => {
                userInput.value = e.results[0][0].transcript;
                handleSend();
            };
        }

        function showStatus(msg, color) {
            const s = document.getElementById('status');
            s.innerText = msg; s.style.backgroundColor = color; s.style.display = 'block';
            setTimeout(() => s.style.display='none', 2500);
        }

        document.getElementById('sendBtn').onclick = handleSend;
        document.getElementById('ttsBtn').onclick = handleTTS;
        userInput.onkeypress = (e) => { if(e.key === 'Enter') handleSend(); };
    </script>
</body>
</html>
