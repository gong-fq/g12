[build]
  # 发布目录（HTML文件所在位置）
  publish = "."
  
  # Functions目录
  functions = "netlify/functions"

[build.environment]
  # Node版本
  NODE_VERSION = "18"

# 重定向规则（可选）
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 头部设置（增强安全性）
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
